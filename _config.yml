title: apuromafo
description: Proyectos de Python, ciberseguridad y regulación — Red, Blue y Purple Team.
locale: es
author:
  name: apuromafo
  location: Chile
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/apuromafo
    - label: Telegram
      icon: fab fa-telegram
      url: https://t.me/Apuromafo
    - label: TryHackMe
      icon: fas fa-flag
      url: https://tryhackme.com/p/apuromafo
    - label: LinkedIn
      icon: fab fa-linkedin
      url: https://linkedin.com/in/mfaundez
    - label: Instagram
      icon: fab fa-instagram
      url: https://www.instagram.com/apuromafo
    - label: X
      icon: fab fa-x-twitter
      url: https://twitter.com/apuromafo
    - label: Sitio
      icon: fas fa-link
      url: https://apuromafo.github.io

remote_theme: mmistakes/minimal-mistakes@4.26.2
minimal_mistakes_skin: default
# El pie de cada página lleva la lista de enlaces del tema. Acá va el acceso a
# las licencias y los créditos de lo que usa el sitio.
footer:
  links:
    - label: Licencias
      icon: fas fa-book
      url: /licencias/
plugins:
  # jekyll-remote-theme va explícito porque, al declarar `plugins:` en vez de
  # usar la lista por defecto de GitHub Pages, es el que trae el tema.
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache
show_excerpts: false
exclude:
  - ESTADO_LOCAL.md
  - planificacion.md
  # Es un .md dentro de assets/: Jekyll lo convertiría en página y aparecería
  # en el sitemap como /assets/fonts/LICENCIAS.html. La licencia se lee en
  # GitHub, que es donde apunta el enlace de la página de créditos.
  - assets/fonts/LICENCIAS.md
  - utilidades
  - .sass-cache
  - README.md
  - CHANGELOG.md
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author_profile: true
      show_date: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
